<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>シンプルカウンター</title>
    <link rel="stylesheet" href="/index.css">
    <script src="/index.js" defer></script>
  </head>
  <body>
    <main class="counter">
      <h1>シンプルカウンター</h1>
      <p class="description">ボタンを押すと、カウントが1増えます。</p>
      <output id="count" aria-label="現在のカウント" aria-live="polite">—</output>
      <button id="increment" type="button" disabled>＋1 カウントする</button>
      <p id="status" role="status">読み込み中…</p>
      <button id="retry" type="button" hidden>再読み込み</button>
    </main>
  </body>
</html>
