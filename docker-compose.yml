name: cloudflare-workers-starter

services:
  workers:
    build:
      context: .
      dockerfile: docker/workers/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./source:/app
      - node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
    environment:
      WRANGLER_SEND_METRICS: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  admin-db:
    depends_on:
      workers:
        condition: service_healthy
    build:
      context: .
      dockerfile: docker/db-admin/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./source-db-admin:/app
      - admin_db_node_modules:/app/node_modules
      - wrangler_state:/app/.wrangler
    environment:
      WRANGLER_SEND_METRICS: "false"

volumes:
  node_modules:
  admin_db_node_modules:
  wrangler_state:
